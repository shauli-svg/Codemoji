<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070711" />
    <title>CodeMoji</title>
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <style>
      body { display: grid; place-items: center; min-height: 100svh; padding: 24px; }
      .lost { width: min(100%, 420px); text-align: center; display: grid; gap: 18px; }
      .glyph { font-size: 80px; line-height: 1; }
      h1 { font-size: clamp(28px, 9vw, 44px); margin: 0; letter-spacing: -0.04em; }
      p { color: var(--muted); margin: 0; }
      a.go-home {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 22px;
        border-radius: 999px;
        color: #070711;
        background: linear-gradient(135deg, var(--gold), var(--aqua));
        text-decoration: none;
        font-weight: 850;
      }
    </style>
  </head>
  <body>
    <main class="lost">
      <div class="glyph">✦</div>
      <h1>הסוד הזה לא כאן</h1>
      <p>אולי הקישור נחתך. תוכל להתחיל סוד חדש משלך.</p>
      <a class="go-home" href="./">סוד חדש</a>
    </main>
  </body>
</html>
